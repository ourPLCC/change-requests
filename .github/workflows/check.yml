name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned Backlog.md
        run: npm i -g "backlog.md@$(cat .backlog-version)"
      - name: Unit tests
        run: |
          python3 -m unittest discover -s tests -t .
          python3 -m unittest discover -s migrate/tests -t .
      - name: Consistency check
        run: python3 bin/check.py --pre-push
      - name: Backlog.md doctor
        run: backlog doctor
